<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="l1kko — black and white manga profile banner">
  <defs>
    <style>
      @keyframes glint {
        0%, 88%, 100% { opacity: 1; }
        93% { opacity: 0.35; }
      }
      .glint { animation: glint 5.5s ease-in-out infinite; }
    </style>
    <pattern id="dotsWhite" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.35" fill="#ffffff"/>
    </pattern>
    <pattern id="dotsBlack" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#000000"/>
    </pattern>
    <linearGradient id="fadeDotsLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeDotsPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="maskLeftDots">
      <rect x="0" y="0" width="780" height="320" fill="url(#fadeDotsLeft)"/>
    </mask>
    <mask id="maskPanelDots">
      <rect x="780" y="8" width="240" height="304" fill="url(#fadeDotsPanel)"/>
    </mask>
    <clipPath id="clipLeft">
      <path d="M0 0 H780 L840 320 H0 Z"/>
    </clipPath>
    <clipPath id="clipPanel">
      <path d="M780 8 H1192 V312 H840 Z"/>
    </clipPath>
    <linearGradient id="shadeUnderEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="maskUnderEye">
      <rect x="850" y="190" width="290" height="90" fill="url(#shadeUnderEye)"/>
    </mask>
  </defs>

  <!-- page -->
  <rect width="1200" height="320" fill="#000000"/>

  <!-- left halftone + speed lines -->
  <rect x="0" y="0" width="780" height="320" fill="url(#dotsWhite)" opacity="0.42" mask="url(#maskLeftDots)"/>
  <g clip-path="url(#clipLeft)" stroke="#ffffff" stroke-width="1" opacity="0.07">
    <line x1="780" y1="160" x2="-100" y2="-40"/>
    <line x1="780" y1="160" x2="-100" y2="10"/>
    <line x1="780" y1="160" x2="-100" y2="60"/>
    <line x1="780" y1="160" x2="-100" y2="110"/>
    <line x1="780" y1="160" x2="-100" y2="160"/>
    <line x1="780" y1="160" x2="-100" y2="210"/>
    <line x1="780" y1="160" x2="-100" y2="260"/>
    <line x1="780" y1="160" x2="-100" y2="310"/>
    <line x1="780" y1="160" x2="-100" y2="360"/>
  </g>

  <!-- giant ghost chapter number -->
  <text x="610" y="305" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="270" font-weight="900" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.055">01</text>

  <!-- left typography -->
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="64" y="64" fill="#a1a1aa" font-size="13" letter-spacing="5">// PROFILE — 2026</text>
  </g>
  <text x="58" y="190" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="112" font-weight="900" letter-spacing="-5" fill="#3f3f46">l1kko</text>
  <text x="62" y="188" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="112" font-weight="900" letter-spacing="-5" fill="#ffffff">l1kko</text>
  <text x="64" y="226" font-family="'JetBrains Mono','Courier New',monospace" font-size="17" letter-spacing="6" fill="#a1a1aa">@l1koo</text>

  <line x1="64" y1="250" x2="500" y2="250" stroke="#ffffff" stroke-width="2"/>
  <text x="64" y="282" font-family="'JetBrains Mono','Courier New',monospace" font-size="14" letter-spacing="4" fill="#d4d4d8">DEVELOPER · MANGA · CODE</text>

  <!-- barcode -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="64" y="298" width="2" height="11"/>
    <rect x="69" y="298" width="5" height="11"/>
    <rect x="77" y="298" width="2" height="11"/>
    <rect x="82" y="298" width="3" height="11"/>
    <rect x="88" y="298" width="6" height="11"/>
    <rect x="97" y="298" width="2" height="11"/>
    <rect x="102" y="298" width="4" height="11"/>
    <rect x="109" y="298" width="2" height="11"/>
    <rect x="114" y="298" width="6" height="11"/>
    <rect x="123" y="298" width="3" height="11"/>
    <rect x="129" y="298" width="2" height="11"/>
    <rect x="134" y="298" width="5" height="11"/>
    <rect x="142" y="298" width="2" height="11"/>
  </g>
  <text x="156" y="307" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" letter-spacing="2.5" fill="#71717a">L1KKO / 2026</text>

  <!-- white manga panel -->
  <path d="M780 8 H1192 V312 H840 Z" fill="#ffffff" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>

  <!-- panel halftone -->
  <g clip-path="url(#clipPanel)">
    <rect x="780" y="8" width="250" height="304" fill="url(#dotsBlack)" opacity="0.38" mask="url(#maskPanelDots)"/>
  </g>

  <!-- panel kanji -->
  <text x="812" y="66" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="42" font-weight="700" fill="#000000" opacity="0.9">眼</text>
  <text x="812" y="92" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" letter-spacing="2" fill="#52525b">EYE / 01</text>

  <!-- manga eye -->
  <g clip-path="url(#clipPanel)">
    <!-- eyebrow -->
    <path d="M850 82 C 920 50, 1040 40, 1108 56 L 1126 64" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- hair strands -->
    <path d="M1196 -12 C 1164 34, 1128 62, 1080 76" fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
    <path d="M1196 32 C 1170 66, 1144 84, 1112 94" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round"/>

    <!-- sclera -->
    <path d="M850 146 C 890 88, 1080 82, 1130 140 C 1085 204, 900 210, 850 146 Z" fill="#ffffff" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>

    <!-- iris -->
    <circle cx="985" cy="146" r="44" fill="#000000"/>
    <circle cx="985" cy="146" r="44" fill="none" stroke="#000000" stroke-width="7"/>
    <circle class="glint" cx="970" cy="129" r="13" fill="#ffffff"/>
    <circle cx="1001" cy="160" r="5.5" fill="#ffffff"/>
    <path d="M962 174 Q 985 188 1009 173" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- upper lid + lashes -->
    <path d="M840 144 C 884 80, 1080 70, 1138 134" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
    <path d="M1128 128 L 1162 100 L 1144 140 Z" fill="#000000"/>
    <path d="M1114 120 L 1148 86 L 1130 132 Z" fill="#000000"/>
    <path d="M846 140 L 818 122 L 838 152 Z" fill="#000000"/>

    <!-- eyelid crease -->
    <path d="M900 96 C 980 76, 1060 76, 1110 92" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

    <!-- lower lid -->
    <path d="M862 180 C 912 208, 1078 204, 1122 170" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

    <!-- halftone shading under eye -->
    <path d="M868 196 Q 990 244 1124 194 L 1124 252 Q 990 278 868 238 Z" fill="url(#dotsBlack)" opacity="0.42" mask="url(#maskUnderEye)"/>
  </g>

  <!-- panel caption -->
  <path d="M832 262 H1192 V312 H840 Z" fill="#000000"/>
  <text x="860" y="294" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" letter-spacing="3" fill="#ffffff">MANGA / MONOCHROME</text>
  <text x="1162" y="301" text-anchor="end" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="900" fill="#ffffff">01</text>

  <!-- page corner marks -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.8">
    <path d="M18 18 H48 M18 18 V48" fill="none"/>
    <path d="M18 302 H48 M18 302 V272" fill="none"/>
  </g>
  <g stroke="#000000" stroke-width="2" opacity="0.7">
    <path d="M1182 18 H1152 M1182 18 V48" fill="none"/>
    <path d="M1182 302 H1152 M1182 302 V272" fill="none"/>
  </g>
</svg>
