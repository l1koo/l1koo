<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="l1kko — end of profile">
  <defs>
    <pattern id="footerDots" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff"/>
    </pattern>
    <linearGradient id="footerFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <mask id="footerMask">
      <rect x="760" y="0" width="440" height="170" fill="url(#footerFade)"/>
    </mask>
    <clipPath id="footerClip">
      <rect x="0" y="0" width="1200" height="170"/>
    </clipPath>
  </defs>

  <rect width="1200" height="170" fill="#000000"/>
  <rect x="1" y="1" width="1198" height="168" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>

  <g clip-path="url(#footerClip)">
    <rect x="760" y="0" width="440" height="170" fill="url(#footerDots)" opacity="0.32" mask="url(#footerMask)"/>
    <g stroke="#ffffff" stroke-width="1" opacity="0.05">
      <line x1="1200" y1="-30" x2="760" y2="200"/>
      <line x1="1200" y1="10" x2="800" y2="220"/>
      <line x1="1200" y1="50" x2="850" y2="240"/>
      <line x1="1200" y1="90" x2="900" y2="260"/>
    </g>
  </g>

  <!-- left block -->
  <text x="64" y="45" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="4" fill="#71717a">// END OF PROFILE</text>
  <text x="60" y="104" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="48" font-weight="900" letter-spacing="-2" fill="#ffffff">l1kko</text>
  <text x="64" y="130" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" letter-spacing="4" fill="#a1a1aa">DEVELOPER · MANGA · CODE</text>
  <line x1="64" y1="146" x2="500" y2="146" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

  <g fill="#ffffff" opacity="0.8">
    <rect x="64" y="153" width="2" height="8"/>
    <rect x="69" y="153" width="5" height="8"/>
    <rect x="77" y="153" width="2" height="8"/>
    <rect x="82" y="153" width="4" height="8"/>
    <rect x="89" y="153" width="2" height="8"/>
    <rect x="94" y="153" width="6" height="8"/>
    <rect x="103" y="153" width="2" height="8"/>
    <rect x="108" y="153" width="3" height="8"/>
    <rect x="114" y="153" width="5" height="8"/>
    <rect x="122" y="153" width="2" height="8"/>
  </g>
  <text x="136" y="161" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" letter-spacing="2" fill="#52525b">L1KKO / 2026</text>

  <!-- hanko stamp -->
  <g transform="rotate(-6 1010 85)">
    <rect x="960" y="35" width="100" height="100" fill="#ffffff" opacity="0.18" transform="translate(7 7)"/>
    <rect x="960" y="35" width="100" height="100" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <rect x="970" y="45" width="80" height="80" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="1010" y="108" text-anchor="middle" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="62" font-weight="700" fill="#000000">終</text>
  </g>

  <!-- vertical japanese -->
  <g font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">
    <text x="1136" y="52">お</text>
    <text x="1136" y="78">わ</text>
    <text x="1136" y="104">り</text>
  </g>
  <text x="1136" y="132" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" letter-spacing="2" fill="#71717a">THE END</text>
</svg>
