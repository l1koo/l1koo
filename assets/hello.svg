<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Hello, World! — manga speech bubble">
  <defs>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      .sparkle-a { animation: twinkle 2.6s ease-in-out infinite; }
      .sparkle-b { animation: twinkle 2.6s ease-in-out 1.1s infinite; }
    </style>
    <pattern id="bubbleDots" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#ffffff"/>
    </pattern>
    <linearGradient id="bubbleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="bubbleMask">
      <rect x="0" y="0" width="900" height="230" fill="url(#bubbleFade)"/>
    </mask>
    <clipPath id="bubbleClip">
      <path d="M68 20 H832 Q860 20 860 48 V152 Q860 180 832 180 H260 L210 220 L200 180 H68 Q40 180 40 152 V48 Q40 20 68 20 Z"/>
    </clipPath>
  </defs>

  <!-- offset shadow -->
  <path d="M78 30 H842 Q870 30 870 58 V162 Q870 190 842 190 H270 L220 230 L210 190 H78 Q50 190 50 162 V58 Q50 30 78 30 Z" fill="#ffffff" opacity="0.16"/>

  <!-- bubble -->
  <path d="M68 20 H832 Q860 20 860 48 V152 Q860 180 832 180 H260 L210 220 L200 180 H68 Q40 180 40 152 V48 Q40 20 68 20 Z" fill="#000000" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

  <!-- halftone inside bubble -->
  <g clip-path="url(#bubbleClip)">
    <rect x="480" y="20" width="380" height="160" fill="url(#bubbleDots)" opacity="0.28" mask="url(#bubbleMask)"/>
  </g>

  <!-- label -->
  <text x="76" y="58" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="3.5" fill="#a1a1aa">00 / PROLOGUE</text>
  <line x1="76" y1="70" x2="230" y2="70" stroke="#52525b" stroke-width="1"/>

  <!-- greeting -->
  <text x="76" y="128" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="900" letter-spacing="-1" fill="#ffffff">Hello, World!</text>
  <text x="78" y="164" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="20" fill="#d4d4d8">こんにちは、世界。</text>

  <!-- small action mark -->
  <g opacity="0.9">
    <path class="sparkle-a" d="M790 76 L 798 96 L 818 104 L 798 112 L 790 132 L 782 112 L 762 104 L 782 96 Z" fill="#ffffff"/>
    <path class="sparkle-b" d="M752 58 L 756 68 L 766 72 L 756 76 L 752 86 L 748 76 L 738 72 L 748 68 Z" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- tail highlight -->
  <path d="M214 214 L 238 186" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
</svg>
