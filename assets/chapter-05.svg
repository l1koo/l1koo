<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Chapter 05 — PROFILE CARD">
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#ffffff"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
    <mask id="dotsMask">
      <rect x="850" y="0" width="350" height="96" fill="url(#fade)"/>
    </mask>
    <clipPath id="barClip">
      <rect x="0" y="0" width="1200" height="96"/>
    </clipPath>
  </defs>

  <rect width="1200" height="96" fill="#000000"/>
  <rect x="1" y="1" width="1198" height="94" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>

  <g clip-path="url(#barClip)">
    <rect x="850" y="0" width="350" height="96" fill="url(#dots)" opacity="0.35" mask="url(#dotsMask)"/>
    <g stroke="#ffffff" stroke-width="1" opacity="0.055">
      <line x1="1200" y1="-20" x2="900" y2="140"/>
      <line x1="1200" y1="10" x2="940" y2="150"/>
      <line x1="1200" y1="40" x2="980" y2="160"/>
      <line x1="1200" y1="70" x2="1020" y2="170"/>
    </g>
  </g>

  <!-- number block -->
  <rect x="32" y="22" width="84" height="52" fill="#ffffff"/>
  <text x="74" y="61" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="900" fill="#000000">05</text>

  <!-- titles -->
  <text x="170" y="30" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" letter-spacing="3.5" fill="#71717a">CHAPTER</text>
  <text x="168" y="61" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="900" letter-spacing="0.5" fill="#ffffff">ПРОФИЛЬ</text>
  <text x="170" y="82" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" letter-spacing="4" fill="#a1a1aa">PROFILE CARD</text>

  <!-- thin rule + diamond -->
  <line x1="610" y1="54" x2="1032" y2="54" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
  <path d="M1054 47 L 1061 54 L 1054 61 L 1047 54 Z" fill="#ffffff" fill-opacity="0.55"/>

  <!-- kanji -->
  <text x="1136" y="71" text-anchor="end" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="46" font-weight="700" fill="#ffffff" fill-opacity="0.92">顔</text>
</svg>
