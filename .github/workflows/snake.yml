name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: l1koo
          outputs: |
            dist/github-snake.svg?color_snake=%23000000&color_dots=%23f4f4f5,%23d4d4d8,%23a1a1aa,%2352525b,%2327272a
            dist/github-snake-dark.svg?color_snake=%23ffffff&color_dots=%2318181b,%233f3f46,%2371717a,%23a1a1aa,%23d4d4d8

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
